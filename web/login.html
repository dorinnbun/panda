<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0806">
  <title>Panda Access</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27none%27 stroke=%27%23ff9a3c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23ff9a3c%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jura:wght@300;400;600&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100dvh; overflow: auto; }
    .gate { position: relative; z-index: 1; width: min(380px, calc(100vw - 32px)); text-align: center; }
    .gate h1 { font-family: var(--wide); font-size: 22px; font-weight: normal; letter-spacing: .5em; color: var(--amber); text-shadow: 0 0 14px var(--amber); margin: 0 0 6px; }
    .gate p { font-family: var(--mono); color: var(--muted); font-size: 12px; letter-spacing: .2em; margin: 0 0 20px; }
    .gate form { display: grid; gap: 10px; }
    .gate input { background: rgba(8,5,3,.8); border: 1px solid var(--line); padding: 12px 14px; color: #fff; font-size: 16px; text-align: center; letter-spacing: .3em; outline: none; }
    .gate input:focus { border-color: var(--amber); }
    .gate .err { color: var(--red); font-family: var(--mono); font-size: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="gate panel" data-serial="ID-2049">
    <h1>PANDA</h1>
    <p>IDENTITY VERIFICATION REQUIRED</p>
    <form id="f">
      <input type="password" id="pw" placeholder="passphrase" autofocus autocomplete="current-password">
      <button class="btn" type="submit">Authenticate</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }),
      });
      if (res.ok) { location.href = "/"; return; }
      err.textContent = res.status === 429 ? "Too many attempts. Locked out for a while." : "Access denied.";
    });
  </script>
</body>
</html>
