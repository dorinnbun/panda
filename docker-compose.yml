services:
  panda:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Only reachable from this machine; the public path is the Cloudflare tunnel.
    ports:
      - "127.0.0.1:8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - panda
